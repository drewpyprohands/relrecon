[project]
name = "relrecon"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B"]
ignore = [
    "S603",   # subprocess without shell=True (not relevant)
    "S607",   # partial path to executable (not relevant)
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `src.*` imports resolve under bare
# `pytest` too, not just `python -m pytest`.
pythonpath = ["."]
